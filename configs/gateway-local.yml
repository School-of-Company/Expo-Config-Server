port: 3000

eureka:
  serviceUrl: http://localhost:8761/eureka

routing:
  prefixes:
    /auth: expo-user-server
    /trainee: expo-user-server
    /participant: expo-user-server
    # 참가자 전화 인증(Expo-Gateway#25). /participant 는 세그먼트 경계로 매칭해 /participant-auth 를 잡지 않으므로 따로 둔다.
    # /internal 은 라우팅하지 않는다(Gateway가 internal 세그먼트를 404로 막는다).
    /participant-auth: expo-user-server
    /admin: expo-user-server
    /expo: expo-expo-server
    /training: expo-expo-server
    /standard: expo-expo-server
    /image: expo-expo-server
    /forms: expo-form-server
    /surveys: expo-form-server
    /sms: expo-notification-server
    /application: expo-application-server
    /attendance: expo-attention-server
    # 종이 QR 발급(POST /qr-tokens/{expoId}, 관리자)은 /attendance 아래가 아니라 별도 접두사로 참여 서비스에 보낸다
    /qr-tokens: expo-attention-server
    # 간편입장 합계 조회·+1/취소(GET·POST /walk-in-counts/{expoId}, 관리자 전용)도 /attendance 아래가 아니라 별도 접두사다. publicPaths에는 넣지 않는다
    /walk-in-counts: expo-attention-server
    /excel: expo-report-server
    /stat: expo-report-server

rateLimit:
  # 모든 요청에 IP별로 걸리는 기본 제한. 행사장 Wi-Fi 하나를 입구 스캐너·부스·방문객이 함께 쓰므로 넉넉히 둔다.
  ttlSeconds: 60
  limit: 500
  # 공개 설문 제출(POST /surveys/answer/public/*)만 IP별로 제한한다. 설문 부스는 공용 IP(행사장 Wi-Fi)를 쓰므로 넉넉히 둔다. 현장에서 429가 보이면 올린다.
  survey:
    ttlSeconds: 60
    limit: 300
  sms:
    ttlSeconds: 60
    limit: 10
  # 인증번호 요청(POST /participant-auth/code)만 IP별로 제한한다(유료 SMS). 번호별 제한은 User/Notification 서버 몫이다.
  participantAuthCode:
    ttlSeconds: 600
    limit: 5
  # 로그인(POST /auth/signin)만 IP별로 제한한다. Gateway가 signin 키를 지원하기 전에는 무시되어 기본 제한만 걸린다(#83).
  signin:
    ttlSeconds: 600
    limit: 10

publicPaths:
  - /health
  - POST /auth
  - POST /auth/signin
  - PATCH /auth
  - POST /sms
  - POST /sms/verify
  - GET /sms
  # 후기 설문: 입장 QR 없이 누구나 로그인 없이 접근한다(Expo-Form-Server#94). 접두사 항목이라 하위 경로 전체가 열린다.
  - /surveys/public
  - /surveys/answer/public
  # 프로그램용 폼 조회: 신청 화면이 로그인 없이 폼 정의를 읽는다(Expo-Form-Server#102). GET으로 한정해 PATCH·DELETE는 열지 않는다. 메서드를 붙인 항목은 정확히 그 경로만 열리므로 `{formId}`(UUID 한 세그먼트)까지 적는다. Gateway#35 이후 문법이다.
  - GET /forms/by-id/{formId}
  # 신청 폼 조회: 참가자 신청 화면(사전·현장 신청)이 로그인 없이 (박람회, 참여자군, 신청방식)으로 폼 정의를 읽는다. 폼 서버 GET /forms/:expoId도 인증이 없다.
  # GET·두 세그먼트(UUID/숫자)만 연다. POST·PATCH /forms/{expoId}, DELETE /forms/{expoId}/..., /forms/by-id/... 쓰기는 계속 JWT 검사를 거친다.
  - GET /forms/{expoId}
  # 이미지 조회: 커버 이미지는 <img>로 불러 토큰을 보낼 수 없다. 박람회 서버도 GET /image/{id}를 permitAll로 연다. Gateway#35 이후 문법이고 업로드 POST /image는 계속 JWT 검사를 거친다.
  - GET /image/{id}
  # 연수 프로그램 목록 조회: 참가자 연수 신청 제출이 로그인 없이 프로그램 제목을 id로 바꾸려고 읽는다. 박람회 서버도 permitAll로 연다.
  # 같은 함수를 관리자 화면·폼 편집기도 토큰 없이 부른다. 조회만 열고 /training 아래 쓰기와 하위 경로는 계속 JWT 검사를 거친다.
  - GET /training/program/{expoId}
  # 참가자 전화 인증(Expo-Gateway#25). PARTICIPANT_SESSION 쿠키로 동작해 JWT 검사를 하지 않는다.
  - POST /participant-auth/code
  - POST /participant-auth/verify
  - GET /participant-auth/session
  - DELETE /participant-auth/session
  # 신청 참가자 공개 경로(Expo-Gateway#29, Expo-Application-Server#75). Gateway#35 이후 문법:
  # {name}은 숫자 또는 UUID 한 세그먼트, {name:A|B}는 나열 값 중 하나에만 매칭한다. 이전 Gateway는 문자 그대로 비교해 열리지 않는다.
  - POST /application/{expoId}
  - POST /application/pre-standard/{expoId}
  - POST /application/field/{expoId}
  - POST /application/field/standard/{expoId}
  - GET /application/expos/{expoId}/preregister-sessions/{sessionId}/capacity
  - GET /application/program-session-csrf
  - POST /application/expos/{expoId}/program-sessions/{programType:STANDARD|TRAINING}/{programId}/applications
  - GET /application/expos/{expoId}/program-sessions/{programType:STANDARD|TRAINING}/{programId}/participants
  - GET /application/expos/{expoId}/participants/{participantId}/qr
  - GET /application/expos/{expoId}/my-applications
  - POST /application/expos/{expoId}/my-applications/{type:PREREGISTER|STANDARD|TRAINING}/{applicationId}/cancellation
  - GET /application/expos/{expoId}/my-applications/preregister-waitlist
  - POST /application/expos/{expoId}/my-applications/preregister-waitlist/cancellation
