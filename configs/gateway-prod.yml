# Vault secret/gateway: jwt.publicKey. 채워 넣는 방법은 docs/service-configs.md 참고.
port: 3000

eureka:
  serviceUrl: "http://<EUREKA_HOST>:8761/eureka"

routing:
  prefixes:
    /auth: expo-user-server
    /trainee: expo-user-server
    /participant: expo-user-server
    # 참가자 전화 인증(Expo-Gateway#25). /participant 는 세그먼트 경계로 매칭해 /participant-auth 를 잡지 않으므로 따로 둔다.
    # /internal 은 라우팅하지 않는다(Gateway가 internal 세그먼트를 404로 막는다).
    /participant-auth: expo-user-server
    /admin: expo-user-server
    /expo: expo-expo-server
    /training: expo-expo-server
    /standard: expo-expo-server
    /image: expo-expo-server
    /forms: expo-form-server
    /surveys: expo-form-server
    /sms: expo-notification-server
    /application: expo-application-server
    /attendance: expo-attention-server
    # 종이 QR 발급(POST /qr-tokens/{expoId}, 관리자)은 /attendance 아래가 아니라 별도 접두사로 참여 서비스에 보낸다
    /qr-tokens: expo-attention-server
    # 간편입장 합계 조회·+1/취소(GET·POST /walk-in-counts/{expoId}, 관리자 전용)도 /attendance 아래가 아니라 별도 접두사다. publicPaths에는 넣지 않는다
    /walk-in-counts: expo-attention-server
    /excel: expo-report-server
    /stat: expo-report-server

rateLimit:
  # 모든 요청에 IP별로 걸리는 기본 제한. 행사장 Wi-Fi 하나를 입구 스캐너·부스·방문객이 함께 쓰므로 넉넉히 둔다.
  ttlSeconds: 60
  limit: 500
  # 공개 설문 제출(POST /surveys/answer/public/*)만 IP별로 제한한다. 설문 부스는 공용 IP(행사장 Wi-Fi)를 쓰므로 넉넉히 둔다. 현장에서 429가 보이면 올린다.
  survey:
    ttlSeconds: 60
    limit: 300
  sms:
    ttlSeconds: 60
    limit: 10
  # 인증번호 요청(POST /participant-auth/code)만 IP별로 제한한다. 행사장 Wi-Fi는 참가자 전체가 IP 하나를 쓰므로(#92)
  # Notification 전체 상한(sms.authMaxSendCountPerHour 300/시간 = 600초에 50)에 맞춘다. 유료 SMS 비용은
  # Notification의 번호별(authMaxSendCount)·서비스 전체 시간당 제한이 막는다. 현장에서 429가 보이면 그 상한과 함께 올린다.
  participantAuthCode:
    ttlSeconds: 600
    limit: 50
  # 로그인(POST /auth/signin)만 IP별로 제한한다(#83). 계정(닉네임) 단위 실패 잠금은 User 서버가 따로 건다.
  signin:
    ttlSeconds: 600
    limit: 10

publicPaths:
  - /health
  - POST /auth
  - POST /auth/signin
  - PATCH /auth
  - POST /sms
  - POST /sms/verify
  - GET /sms
  # 후기 설문: 입장 QR 없이 누구나 로그인 없이 접근한다(Expo-Form-Server#94). 접두사 항목이라 하위 경로 전체가 열린다.
  - /surveys/public
  - /surveys/answer/public
  # 프로그램용 폼 조회: 신청 화면이 로그인 없이 폼 정의를 읽는다(Expo-Form-Server#102). GET으로 한정해 PATCH·DELETE는 열지 않는다. 메서드를 붙인 항목은 정확히 그 경로만 열리므로 `{formId}`(UUID 한 세그먼트)까지 적는다. Gateway#35 이후 문법이다.
  - GET /forms/by-id/{formId}
  # 신청 폼 조회: 참가자 신청 화면(사전·현장 신청)이 로그인 없이 (박람회, 참여자군, 신청방식)으로 폼 정의를 읽는다. 폼 서버 GET /forms/:expoId도 인증이 없다.
  # GET·두 세그먼트(UUID/숫자)만 연다. POST·PATCH /forms/{expoId}, DELETE /forms/{expoId}/..., /forms/by-id/... 쓰기는 계속 JWT 검사를 거친다.
  - GET /forms/{expoId}
  # 설문 조회: 참가자 만족도 조사 응답 화면이 로그인 없이 (박람회, 참여자군)으로 설문 문항을 읽는다(#140). 폼 서버 GET /surveys/:expoId도 인증이 없다.
  # GET·두 세그먼트(UUID/숫자)만 연다. POST·PATCH /surveys/{expoId}, DELETE /surveys/{expoId}/... 쓰기는 계속 JWT 검사를 거친다.
  - GET /surveys/{expoId}
  # 참가자 만족도 조사 제출(#100): 응답 화면이 로그인 없이 보낸다. 폼 서버가 전화번호로 응답자를 확인하고 같은 응답자의 중복 제출을 막는다.
  # 이 두 경로만 정확히 연다. rateLimit.survey는 /surveys/answer/public 만 세므로 여기에는 기본 IP 제한만 걸린다.
  - POST /surveys/answer/standard/{expoId}
  - POST /surveys/answer/trainee/{expoId}
  # 이미지 조회: 커버 이미지는 <img>로 불러 토큰을 보낼 수 없다. 박람회 서버도 GET /image/{id}를 permitAll로 연다. Gateway#35 이후 문법이고 업로드 POST /image는 계속 JWT 검사를 거친다.
  - GET /image/{id}
  # 연수 프로그램 목록 조회: 참가자 연수 신청 제출이 로그인 없이 프로그램 제목을 id로 바꾸려고 읽는다. 박람회 서버도 permitAll로 연다.
  # 같은 함수를 관리자 화면·폼 편집기도 토큰 없이 부른다. 조회만 열고 /training 아래 쓰기와 하위 경로는 계속 JWT 검사를 거친다.
  - GET /training/program/{expoId}
  # 참가자 일반 프로그램 신청·신청 내역이 토큰 없이 읽는 목록만 공개한다 (#99).
  - GET /standard/program/{expoId}
  # 참가자용 사전등록 회차 목록(Expo-Expo-Server#118): 신청 화면이 로그인 없이 회차를 고른다. 박람회 서버도 이 경로만 permitAll로 연다.
  # 관리자 목록·단건 조회(GET /expo/{expoId}/preregister-sessions[/{sessionId}])와 쓰기는 계속 JWT 검사를 거친다. Gateway#35 이후 문법이다.
  - GET /expo/{expoId}/preregister-sessions/public
  # 참가자 신청 화면용 박람회 공개 조회(Expo-Expo-Server#155). 박람회 서버도 이 경로만 permitAll로 열고, 기존 상세 GET /expo/{expoId}는 계속 JWT 검사를 거친다.
  - GET /expo/{expoId}/public
  # 참가자 전화 인증(Expo-Gateway#25). PARTICIPANT_SESSION 쿠키로 동작해 JWT 검사를 하지 않는다.
  - POST /participant-auth/code
  - POST /participant-auth/verify
  - GET /participant-auth/session
  - DELETE /participant-auth/session
  # 신청 참가자 공개 경로(Expo-Gateway#29, Expo-Application-Server#75). Gateway#35 이후 문법:
  # {name}은 숫자 또는 UUID 한 세그먼트, {name:A|B}는 나열 값 중 하나에만 매칭한다. 이전 Gateway는 문자 그대로 비교해 열리지 않는다.
  - POST /application/{expoId}
  - POST /application/pre-standard/{expoId}
  - POST /application/field/{expoId}
  - POST /application/field/standard/{expoId}
  - GET /application/expos/{expoId}/preregister-sessions/{sessionId}/capacity
  - GET /application/program-session-csrf
  - POST /application/expos/{expoId}/program-sessions/{programType:STANDARD|TRAINING}/{programId}/applications
  - POST /application/expos/{expoId}/program-sessions/{programType:STANDARD|TRAINING}/{programId}/application-batches
  - POST /application/expos/{expoId}/program-sessions/{programType:STANDARD|TRAINING}/{programId}/onsite-applications
  - POST /application/expos/{expoId}/program-sessions/{programType:STANDARD|TRAINING}/{programId}/onsite-application-batches
  - GET /application/expos/{expoId}/program-sessions/{programType:STANDARD|TRAINING}/{programId}/participants
  - GET /application/expos/{expoId}/participants/{participantId}/qr
  - GET /application/expos/{expoId}/my-applications
  - POST /application/expos/{expoId}/my-applications/{type:PREREGISTER|STANDARD|TRAINING}/{applicationId}/cancellation
  - POST /application/expos/{expoId}/my-applications/PREREGISTER/{applicationId}/companions
  - GET /application/expos/{expoId}/my-applications/preregister-waitlist
  - POST /application/expos/{expoId}/my-applications/preregister-waitlist/cancellation
  # 대기 승급 참여 제안 조회·수락·거절(Expo-Application-Server#144, #115). 같은 참가자 세션·CSRF 방식이고 {offerId}는 UUID다.
  - GET /application/expos/{expoId}/my-applications/promotion-offers
  - POST /application/expos/{expoId}/my-applications/promotion-offers/{offerId}/acceptance
  - POST /application/expos/{expoId}/my-applications/promotion-offers/{offerId}/decline
  # 신청화면 방문 기록(#101): 로그인 없이 진입마다 한 번 보낸다. 신청 서버가 로그인·CSRF 없이 열고 visitorId(UUID)만 받는다. 관리자 조회 /application/admin/expos/{expoId}/page-views는 열지 않는다.
  - POST /application/expos/{expoId}/page-views

# 통합 API 문서(GET /docs, Expo-Gateway#50). 운영은 문서 전용 Basic 인증이 있을 때만 연다.
# docs.basicAuth(username, password)는 Vault secret/gateway에서 병합된다. 이 파일에 넣지 않는다.
# requireAuth: true라 Vault 값이 없으면 Gateway가 부팅하지 않는다(문서가 인증 없이 열리지 않게). 문서 JSON은 publicPaths에 열지 않는다.
# Try it out은 운영 데이터를 바꾸지 못하게 끈다. 각 서비스 서버에 SWAGGER_ENABLED=true가 있어야 JSON이 나온다.
docs:
  enabled: true
  requireAuth: true
  tryItOut: false
  title: Expo API 문서
  services:
    - name: 참여
      url: /attendance/v3/api-docs
    - name: 폼
      url: /forms/v3/api-docs
    - name: 유저
      url: /auth/v3/api-docs
    - name: 박람회
      url: /expo/v3/api-docs
    - name: 신청
      url: /application/v3/api-docs
    - name: 알림
      url: /sms/v3/api-docs
    - name: 리포트
      url: /stat/v3/api-docs
