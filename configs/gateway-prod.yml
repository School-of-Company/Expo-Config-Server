# Vault secret/gateway: jwt.publicKey. 채워 넣는 방법은 docs/service-configs.md 참고.
port: 3000

eureka:
  serviceUrl: "http://<EUREKA_HOST>:8761/eureka"

routing:
  prefixes:
    /auth: expo-user-server
    /trainee: expo-user-server
    /participant: expo-user-server
    /admin: expo-user-server
    /expo: expo-expo-server
    /training: expo-expo-server
    /standard: expo-expo-server
    /image: expo-expo-server
    /forms: expo-form-server
    /surveys: expo-form-server
    /sms: expo-notification-server
    /application: expo-application-server
    /attendance: expo-attention-server
    /excel: expo-report-server
    /stat: expo-report-server

rateLimit:
  # 모든 요청에 IP별로 걸리는 기본 제한. 행사장 Wi-Fi 하나를 입구 스캐너·부스·방문객이 함께 쓰므로 넉넉히 둔다.
  ttlSeconds: 60
  limit: 500
  # 공개 설문 제출(POST /surveys/answer/public/*)만 IP별로 제한한다. 설문 부스는 공용 IP(행사장 Wi-Fi)를 쓰므로 넉넉히 둔다. 현장에서 429가 보이면 올린다.
  survey:
    ttlSeconds: 60
    limit: 300

publicPaths:
  - /health
  - POST /auth
  - POST /auth/signin
  - PATCH /auth
  # 후기 설문: 입장 QR 없이 누구나 로그인 없이 접근한다(Expo-Form-Server#94). 접두사 항목이라 하위 경로 전체가 열린다.
  - /surveys/public
  - /surveys/answer/public
