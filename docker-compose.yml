services:
  # Local dev-mode Vault only. Never use VAULT_DEV_ROOT_TOKEN_ID / dev mode in production —
  # production points VAULT_ADDR/VAULT_TOKEN at a real, externally-provisioned Vault instead.
  vault:
    image: hashicorp/vault:latest
    container_name: expo-config-vault
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: dev-root-token
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    ports:
      - "8200:8200"
    networks:
      - config-network

  config-server:
    build: .
    container_name: expo-config-server
    depends_on:
      - vault
    environment:
      PORT: 3000
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: dev-root-token
    ports:
      - "3000:3000"
    networks:
      - config-network

networks:
  config-network:
    driver: bridge
