name: Deploy

# main -> prod, develop -> dev (glink.kr, team1/expo)
# configs/ 를 릴리스에 같이 담는다. 설정을 바꾸면 이 서버를 재배포한 뒤 각 서비스를 재시작해야 반영된다.
on:
  push:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: deploy-config-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref_name == 'main' || github.ref_name == 'develop'
    runs-on: ubuntu-latest
    env:
      SVC: config
      DEPLOY_ENV: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
      REMOTE_ROOT: /srv/users/festa/2026/dev/team1/expo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm

      - name: Install
        run: npm ci

      # 테스트가 실패하면 업로드 전에 멈춘다.
      - name: Test
        run: |
          npm test
          npm run test:e2e

      - name: Build
        run: |
          npm run build
          npm prune --omit=dev

      - name: Package
        run: |
          mkdir -p configs
          tar czf release.tar.gz dist node_modules package.json configs

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.EXPO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.EXPO_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Upload and deploy
        env:
          HOST: ${{ vars.EXPO_SSH_HOST }}
          PORT: ${{ vars.EXPO_SSH_PORT }}
          USER: ${{ vars.EXPO_SSH_USER }}
        run: |
          REL="${GITHUB_SHA::12}-${GITHUB_RUN_ATTEMPT}"
          scp -P "$PORT" release.tar.gz "$USER@$HOST:$REMOTE_ROOT/apps/$DEPLOY_ENV/$SVC/incoming/$REL.tar.gz"
          ssh -p "$PORT" "$USER@$HOST" "$REMOTE_ROOT/bin/deploy.sh $SVC $DEPLOY_ENV $REL"
